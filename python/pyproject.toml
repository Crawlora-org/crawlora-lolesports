[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crawlora-lolesports"
version = "0.1.0"
description = "Crawlora LoL Esports API client with 13 endpoints for leagues, schedules, live and completed events, teams, players, and game details"
readme = "README.md"
keywords = ["crawlora", "api-client", "sdk", "web-scraping", "scraping-api", "lolesports", "lol-esports", "lolesports-api", "lol-esports-api", "lolesports-scraper", "lol-esports-scraper", "lolesports-data", "lol-esports-data", "lolesports-leagues", "lolesports-schedules", "lolesports-live-completed-events", "lolesports-teams", "lolesports-players", "lolesports-game-details"]
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Crawlora" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Typing :: Typed",
]
dependencies = ["typing-extensions>=4.7; python_version < '3.11'"]

[project.optional-dependencies]
async = ["httpx>=0.27"]
test = ["mypy>=1.11", "pytest>=8"]

[project.urls]
Homepage = "https://crawlora.net/?utm_source=pypi&utm_medium=referral&utm_campaign=platform-clients&utm_content=lolesports-python-homepage"
Documentation = "https://crawlora.net/docs?utm_source=pypi&utm_medium=referral&utm_campaign=platform-clients&utm_content=lolesports-python-api-docs"
Repository = "https://github.com/Crawlora-org/crawlora-lolesports"

[tool.setuptools.packages.find]
where = ["."]
include = ["crawlora_lolesports"]

[tool.setuptools.package-data]
"crawlora_lolesports" = ["py.typed", "*.pyi"]
